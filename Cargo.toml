[package]
name = "wl-translate"
version = "0.1.0"
edition = "2021"
description = "On-screen OCR and translation for Wayland"
license = "MIT"

[[bin]]
name = "wl-translate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
leptess = "0.14"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
