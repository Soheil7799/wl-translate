[package]
name = "wl-translate"
version = "0.1.0"
edition = "2021"
description = "On-screen OCR and translation for Wayland"
license = "MIT"

[[bin]]
name = "wl-translate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
leptess = "0.14"

image = { version = "0.25", default-features = false, features = ["png"] }



# D-Bus. On tokio, served from a thread of its own and handed to the GTK main
# loop over an async channel.
zbus = { version = "5.18.0", default-features = false, features = ["tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
# GTK4 for the UI, for one reason above all: Pango implements the Unicode
# bidirectional algorithm and Arabic shaping properly, including caret
# movement and selection through mixed right-to-left and left-to-right runs.
# This app exists to edit Persian text, not merely to display it.
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
glib = "0.21"
async-channel = "2.5.0"
# Cairo draws the annotations both on screen and into the saved PNG. One
# renderer for both is the point: two of them drift, and the preview stops
# matching the file in ways nobody notices until it matters.
cairo-rs = { version = "0.22", features = ["png"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
