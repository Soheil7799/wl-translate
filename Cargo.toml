[package]
name = "wl-translate"
version = "0.1.0"
edition = "2021"
description = "On-screen OCR and translation for Wayland"
license = "MIT"

[[bin]]
name = "wl-translate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json", "tls"] }
leptess = "0.14"

image = { version = "0.25", default-features = false, features = ["png"] }

# Already in the tree as iced's fallback renderer. Used directly to bake
# annotations into the saved PNG with a real anti-aliased rasteriser, rather
# than hand-rolling line and arrow drawing over raw pixels.
tiny-skia = { version = "0.11", features = ["png-format"] }

# D-Bus, on tokio so it shares iced's runtime rather than dragging in async-io.
zbus = { version = "5.18.0", default-features = false, features = ["tokio"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
# GTK4 for the UI. Pango handles Persian and bidirectional text properly,
# which is the entire reason this branch exists: iced renders Persian fine
# but its text inputs mishandle the cursor and selection in right-to-left
# text, and this app is for editing that text, not just looking at it.
gtk = { version = "0.11", package = "gtk4", features = ["v4_12"] }
glib = "0.21"
async-channel = "2.5.0"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
